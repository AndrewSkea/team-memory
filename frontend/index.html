<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Team Memory</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c84e1a'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/ui/main.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-icon" aria-hidden="true">🧠</div>
      <h1>Team Memory</h1>
      <p class="subtitle">What your team knows, available to every assistant</p>
    </header>

    <nav class="nav-card" id="nav" aria-label="Sections" hidden>
      <button class="nav-btn" data-page="remember">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10v12l-5-3-5 3V2z"/></svg>
        Remember
      </button>
      <button class="nav-btn" data-page="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
        Search
      </button>
      <button class="nav-btn" data-page="review">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8l4 4 8-8"/></svg>
        Review <span class="badge" id="review-badge" hidden></span>
      </button>
      <button class="nav-btn" data-page="meetings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Meetings
      </button>
      <button class="nav-btn" data-page="stats">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6.5" y="5" width="3" height="10" rx="1"/><rect x="12" y="2" width="3" height="13" rx="1"/></svg>
        Stats
      </button>
      <button class="nav-btn" data-page="settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5-1.5M11.5 4.5L13 3"/></svg>
        Settings
      </button>
    </nav>

    <main id="root"></main>

    <footer class="footer" id="footer"></footer>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
